<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin login | FreePufferFish</title>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)),
                url("/static/background.jpg") center / cover;
            color: #183040;
            font-family: Arial, sans-serif;
        }
        main {
            width: min(100%, 380px);
            padding: 36px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 18px;
            background: rgba(138, 213, 172, 0.582);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }
        h1 { margin-top: 0; text-align: center; }
        label { display: block; margin: 18px 0 6px; }
        input {
            width: 100%;
            padding: 11px;
            border: 1px solid #000304;
            border-radius: 6px;
        }
        button {
            width: 100%;
            margin-top: 24px;
            padding: 12px;
            border: 0;
            border-radius: 6px;
            background: #0f2a3b;
            color: rgb(192, 247, 180);
            cursor: pointer;
        }
        .error {
            padding: 10px;
            border-radius: 6px;
            background: #a5f2a8;
            color: #881609;
        }
        .back { display: block; margin-top: 18px; text-align: center; color: #183040; }
    </style>
</head>
<body>
    <main>
        <h1>Admin login</h1>
        {% if error %}<p class="error">{{ error }}</p>{% endif %}
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <label for="username">Admin username</label>
            <input id="username" name="username" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
        <a class="back" href="{{ url_for('home') }}">Back to site login</a>
    </main>
</body>
</html>
